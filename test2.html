<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>contact</title>
    <link rel="stylesheet" href="c.css" />
  </head>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800&display=swap");

    * {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      font-family: Poppins, sans-serif;
    }

    body {
      width: 100%;
      position: relative;
    }

    main {
      display: flex;
      background-color: rgb(235 196 8);
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      padding: 5vh 5vw;
    }

    .content {
      width: 50%;
    }

    .content h1 {
      font-size: calc(2rem + 3vw);
      font-weight: bold;
      margin-bottom: 1rem;
      position: relative;
      left: 2vw;
      top: 5vh;
    }

    .content p {
      font-size: 1.2vw;
      position: relative;
      left: 2vw;
      top: 5vh;
      opacity: 0.8;
      line-height: 1.6;
      margin-top: 2vw;
    }

    .container {
      border-radius: 1rem;
      width: 45%;
      padding: 2vw;
      display: flex;
      flex-direction: column;
      background-color: rgb(24, 24, 24);
      color: antiquewhite;
      margin: 2vw;
    }

    .container label {
      display: block;
      font-weight: bold;
      margin: 1rem 0 0.5rem;
      font-size: 1.5vw;
      color: rgb(235 196 8);
    }

    .container input,
    .container textarea {
      width: 100%;
      padding: 1.5vw;
      border: none;
      border-radius: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 1vw;
    }

    .container button {
      border-radius: 0.5rem;
      width: 40%;
      padding: 1vw;
      border: none;
      background: white;
      color: black;
      font-weight: bold;
      cursor: pointer;
      font-size: 1.3vw;
      margin: 2vw auto;
    }

    .container input {
      height: 4vh;
    }

    .container textarea {
      height: 15vh;
    }

    .social-icons {
      position: relative;
      top: 7vh;
      left: 2vw;
    }

    .social-icons img {
      margin-right: 1vw;
      height: 4vh;
    }

    @media (max-width: 768px) {
      main {
        flex-direction: column;
        padding: 5vh 2vw;
      }

      .content {
        width: 100%;
        text-align: center;
      }
      .content h1 {
        position: static;
        left: auto;
        font-size: calc(2.5rem + 5vw);
      }

      .content p {
        position: static;
        left: auto;
        font-size: 1.5rem;
        margin-top: 5vw;
      }
      .social-icons {
        position: static;
        display: flex;
        justify-content: center;
        margin-top: 5vw;
      }

      .container {
        width: 90%;
        margin: 2vw auto;
      }
      .container label {
        font-size: 2rem;
      }

      .container input,
      .container textarea {
        padding: 2rem;
        font-size: 1.5rem;
      }
      .container button {
        font-size: 1.8rem;
        width: 60%;
      }
      .container input {
        height: 6vh;
      }

      .container textarea {
        height: 25vh;
      }
      .social-icons img {
        height: 5vh;
        margin: 0 10px;
      }
    }
  </style>

  <body>
    <main>
      <div class="content">
        <h1>
          Let's get <br />
          in touch
        </h1>
        <p>
          Great! We’re excited to hear from you. Let’s build <br />something
          amazing together. <br />

          Call us for any inquiry.
        </p>
        <div class="social-icons">
          <img src="images/instagram-line.png" alt="instagram" />
          <img src="images/facebook-box-fill.png" alt="whatsapp" />
          <img src="images/linkedin-box-fill.png" alt="LinkedIn" />
          <img src="images/phone-fill.png" alt="mail" />
        </div>
      </div>
      <div class="container">
        <form>
          <div class="form-grp">
            <label for="name">Name</label>
            <input
              type="text"
              name=""
              id="name"
              placeholder="Enter your name"
              required
            />
          </div>
          <div class="form-grp">
            <label for="mobile">Mobile-no</label>
            <input
              type="tel"
              name=""
              id="number"
              placeholder="Enter your mobile no"
              required
            />
          </div>
          <div class="form-grp">
            <label for="message">Message</label>
            <textarea
              id="message"
              placeholder="Enter your message here"
              required
            ></textarea>
          </div>
          <button type="submit">Submit</button>
        </form>
      </div>
    </main>
  </body>
</html>
