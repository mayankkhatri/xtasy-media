<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskboard App</title>
    <!-- Remix Icon CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="https://static.vecteezy.com/system/resources/previews/050/757/348/non_2x/clock-icon-transparent-background-free-png.png"
    />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <link rel="stylesheet" href="styles/taskboard.css" />
    <style>
      .task-card.overtime .timer-display {
        color: #ff4d4d;
        font-weight: bold;
      }
      .month-nav-header {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 10px;
      }
      .month-nav {
        cursor: pointer;
        font-size: 1.5rem;
        margin: 0 15px;
        color: #ddd;
      }
      .month-nav:hover {
        color: #fff;
      }
      .task-input-section .track-time-toggle {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 15px;
      }
      .time-inputs-container.hidden {
        display: none;
      }
      .task-complete-checkbox {
        width: 24px;
        height: 24px;
        border: 2px solid #ccc;
        border-radius: 5px;
        cursor: pointer;
      }
      .task-complete-checkbox:hover {
        border-color: #4caf50;
      }
      .completed-task-card .time-taken.no-time {
        color: #aaa;
      }

      /* --- NEW SWIPABLE DATE ROW STYLING --- */
      #dateRow {
        display: flex;
        overflow-x: auto;
        white-space: nowrap;
        padding: 10px 15px;
        /* Hides the scrollbar for a cleaner 'swipable' look */
        -ms-overflow-style: none; /* IE and Edge */
        scrollbar-width: none; /* Firefox */
      }
      #dateRow::-webkit-scrollbar {
        display: none; /* Chrome, Safari, and Opera */
      }
      .date-item {
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-width: 55px;
        height: 55px;
        border-radius: 8px;
        cursor: pointer;
        border: 2px solid transparent;
        transition: all 0.2s ease-in-out;
        margin: 0 4px;
        padding-bottom: 3px;
      }
      .date-item .day-name {
        font-size: 0.8em;
        color: #aaa;
      }
      .date-item .date-number {
        font-size: 1.1em;
        font-weight: 500;
      }
      .date-item.today {
        border-color: #00ff6e;
      }
      .date-item.selected {
        background-color: #4caf50;
        color: #fff;
        border-color: #00ff77;
      }
      .date-item.selected .day-name {
        color: #eee;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Header Section -->
      <div class="header">
        <div class="logo">
          <img src="https://i.postimg.cc/k5F70t2x/Logo-2.png" alt="logo" />
        </div>
        <div class="app-buttons">
          <a href="timer.html" class="active">Taskboard</a>
          <a href="habits.html">Habits</a>
          <a href="body.html">Body</a>
        </div>
      </div>

      <!-- NEW: Month Navigation Header -->
      <div class="month-nav-header" id="monthNavHeader">
        <!-- Month/Year will be generated here -->
      </div>

      <!-- Date Row Section (now just for the dates) -->
      <div class="date-row" id="dateRow">
        <!-- Dates will be generated by JavaScript -->
      </div>

      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Task Input Section (Unchanged) -->
        <div class="task-input-section">
          <h2>Add Task</h2>
          <input type="text" id="taskNameInput" placeholder="Task Name" />
          <div class="group-name-dropdown">
            <div
              class="group-name-dropdown-btn"
              onclick="toggleGroupDropdown()"
            >
              <span id="selectedGroupName">Group Name</span>
              <i class="ri-arrow-down-s-line"></i>
            </div>
            <div
              class="group-name-dropdown-content"
              id="groupDropdownContent"
            ></div>
          </div>
          <div class="track-time-toggle">
            <input
              type="checkbox"
              id="trackTimeCheckbox"
              checked
              onchange="toggleTimeInputs()"
            />
            <label for="trackTimeCheckbox">Track Time</label>
          </div>
          <div id="timeInputsContainer">
            <div class="time-options">
              <button data-minutes="5">5 Min</button
              ><button data-minutes="10">10 Min</button
              ><button data-minutes="15">15 Min</button
              ><button data-minutes="20">20 Min</button
              ><button data-minutes="25">25 Min</button
              ><button data-minutes="30">30 Min</button
              ><button data-minutes="45">45 Min</button>
            </div>
            <div class="custom-time-input">
              <input
                type="number"
                id="customMinutesInput"
                placeholder="Enter Minutes"
              /><span>Min</span>
            </div>
          </div>
          <button class="add-task-btn" onclick="addTask()">Add Task</button>
        </div>

        <!-- Completed Tasks Section (Unchanged) -->
        <div class="completed-tasks-section">
          <h2>Completed Tasks</h2>
          <div id="completedTasksContainer"></div>
          <div class="completed-tasks-stats" id="completedTasksStats"></div>
        </div>
      </div>

      <!-- Taskboard Section (Unchanged) -->
      <div class="taskboard" id="taskboardContainer"></div>
    </div>

    <script>
      let selectedDate = null;
      let currentDisplayDate = new Date();

      // REWRITTEN generateDateRow function
      function generateDateRow(dateToDisplay) {
        const dateRow = document.getElementById("dateRow");
        const monthNavHeader = document.getElementById("monthNavHeader");
        dateRow.innerHTML = "";
        monthNavHeader.innerHTML = "";

        const today = new Date();
        const year = dateToDisplay.getFullYear();
        const month = dateToDisplay.getMonth();

        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthNames = [
          "January",
          "February",
          "March",
          "April",
          "May",
          "June",
          "July",
          "August",
          "September",
          "October",
          "November",
          "December",
        ];

        // --- Create Month Navigation ---
        const prevMonthBtn = document.createElement("i");
        prevMonthBtn.className = "ri-arrow-left-s-line month-nav";
        prevMonthBtn.onclick = previousMonth;
        monthNavHeader.appendChild(prevMonthBtn);

        const monthNameSpan = document.createElement("span");
        monthNameSpan.textContent = `${monthNames[month]} ${year}`;
        monthNavHeader.appendChild(monthNameSpan);

        const nextMonthBtn = document.createElement("i");
        nextMonthBtn.className = "ri-arrow-right-s-line month-nav";
        nextMonthBtn.onclick = nextMonth;
        monthNavHeader.appendChild(nextMonthBtn);

        // --- Create Date Items ---
        for (let i = 1; i <= daysInMonth; i++) {
          const dayDate = new Date(year, month, i);
          const dayName = dayDate.toLocaleDateString("en-US", {
            weekday: "short",
          });

          const dateItem = document.createElement("div");
          dateItem.classList.add("date-item");

          dateItem.innerHTML = `
              <span class="day-name">${dayName}</span>
              <span class="date-number">${i}</span>
          `;

          const dateStr = `${year}-${String(month + 1).padStart(
            2,
            "0"
          )}-${String(i).padStart(2, "0")}`;
          dateItem.dataset.date = dateStr;

          // Highlight today only if viewing the current month and year
          if (
            i === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
          ) {
            dateItem.classList.add("today");
          }

          dateItem.addEventListener("click", () => {
            document
              .querySelectorAll(".date-item.selected")
              .forEach((el) => el.classList.remove("selected"));
            dateItem.classList.add("selected");
            selectedDate = dateStr;
            displayTasksForDate(selectedDate);
            scrollActiveDateIntoView(); // Scroll to selected
          });

          // Auto-select today on initial load of the current month
          if (
            i === today.getDate() &&
            month === today.getMonth() &&
            year === today.getFullYear()
          ) {
            if (selectedDate === null) {
              dateItem.classList.add("selected");
              selectedDate = dateStr;
              displayTasksForDate(selectedDate);
            }
          }
          // Restore selection if navigating back to a month with a selected date
          if (dateStr === selectedDate) {
            dateItem.classList.add("selected");
          }

          dateRow.appendChild(dateItem);
        }

        if (
          !selectedDate &&
          dateToDisplay.getMonth() === new Date().getMonth() &&
          dateToDisplay.getFullYear() === new Date().getFullYear()
        ) {
          // If no date is selected and we're in the current month, select today.
          const todayEl = document.querySelector(".date-item.today");
          if (todayEl) todayEl.click();
        } else if (!document.querySelector(".date-item.selected")) {
          displayTasksForDate(null);
        }

        scrollActiveDateIntoView(); // Scroll to today or selected date on load
      }

      function previousMonth() {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() - 1);
        selectedDate = null;
        generateDateRow(currentDisplayDate);
      }

      function nextMonth() {
        currentDisplayDate.setMonth(currentDisplayDate.getMonth() + 1);
        selectedDate = null;
        generateDateRow(currentDisplayDate);
      }

      // NEW helper function to scroll the active date into view
      function scrollActiveDateIntoView() {
        setTimeout(() => {
          let activeEl = document.querySelector(".date-item.selected");
          if (!activeEl) {
            activeEl = document.querySelector(".date-item.today");
          }
          if (activeEl) {
            activeEl.scrollIntoView({
              behavior: "smooth",
              inline: "center",
              block: "nearest",
            });
          }
        }, 100);
      }

      function toggleTimeInputs() {
        document
          .getElementById("timeInputsContainer")
          .classList.toggle(
            "hidden",
            !document.getElementById("trackTimeCheckbox").checked
          );
      }
      const timeOptionButtons = document.querySelectorAll(
        ".time-options button"
      );
      let selectedMinutes = 0;
      timeOptionButtons.forEach((button) => {
        button.addEventListener("click", function () {
          timeOptionButtons.forEach((btn) => btn.classList.remove("selected"));
          this.classList.add("selected");
          selectedMinutes = parseInt(this.dataset.minutes);
          document.getElementById("customMinutesInput").value = "";
        });
      });
      document
        .getElementById("customMinutesInput")
        .addEventListener("input", function () {
          timeOptionButtons.forEach((btn) => btn.classList.remove("selected"));
          selectedMinutes = parseInt(this.value) || 0;
        });
      const TASKS_STORAGE_KEY = "taskboard_tasks";
      const GROUPS_STORAGE_KEY = "taskboard_groups";
      let tasks = loadTasks() || [];
      let groups = loadGroups() || ["General"];
      function saveTasks() {
        localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasks));
      }
      function loadTasks() {
        const loaded = localStorage.getItem(TASKS_STORAGE_KEY);
        if (loaded) {
          return JSON.parse(loaded).map((task, index) => ({
            order: task.order !== undefined ? task.order : index,
            ...task,
          }));
        }
        return null;
      }
      function saveGroups() {
        localStorage.setItem(GROUPS_STORAGE_KEY, JSON.stringify(groups));
      }
      function loadGroups() {
        return localStorage.getItem(GROUPS_STORAGE_KEY)
          ? JSON.parse(localStorage.getItem(GROUPS_STORAGE_KEY))
          : null;
      }
      let groupDropdownVisible = false;
      function toggleGroupDropdown() {
        groupDropdownVisible = !groupDropdownVisible;
        renderGroupDropdown();
      }
      function addTask() {
        const taskName = document.getElementById("taskNameInput").value.trim();
        const groupName =
          document.getElementById("selectedGroupName").textContent;
        const isTimed = document.getElementById("trackTimeCheckbox").checked;
        const durationMinutes = selectedMinutes;
        if (!taskName) {
          alert("Task name cannot be empty.");
          return;
        }
        if (isTimed && durationMinutes <= 0) {
          alert("Please select or enter a valid duration for a timed task.");
          return;
        }
        if (!selectedDate) {
          alert("Please select a date first.");
          return;
        }
        const tasksInGroupOnDate = tasks.filter(
          (t) =>
            t.group === groupName &&
            t.taskDate === selectedDate &&
            t.status !== "completed"
        );
        const newOrder =
          tasksInGroupOnDate.length > 0
            ? Math.max(...tasksInGroupOnDate.map((t) => t.order)) + 1
            : 0;
        const newTask = {
          id: Date.now(),
          name: taskName,
          group: groupName,
          isTimed: isTimed,
          duration: isTimed ? durationMinutes * 60 : 0,
          status: "pending",
          startTime: null,
          elapsedTime: 0,
          taskDate: selectedDate,
          order: newOrder,
        };
        tasks.push(newTask);
        saveTasks();
        displayTasksForDate(selectedDate);
        document.getElementById("taskNameInput").value = "";
        timeOptionButtons.forEach((btn) => btn.classList.remove("selected"));
        document.getElementById("customMinutesInput").value = "";
        selectedMinutes = 0;
      }
      function displayTasksForDate(date) {
        const taskboardContainer =
          document.getElementById("taskboardContainer");
        taskboardContainer.innerHTML = "";
        const completedTasksContainer = document.getElementById(
          "completedTasksContainer"
        );
        completedTasksContainer.innerHTML = "";
        if (!date) {
          taskboardContainer.innerHTML =
            "<p>Please select a date to see tasks.</p>";
          document.getElementById("completedTasksStats").textContent = "";
          return;
        }
        const tasksForDate = tasks.filter((task) => task.taskDate === date);
        let completedCount = 0,
          remainingCount = 0;
        const pendingTasks = [];
        tasksForDate.forEach((task) => {
          if (task.status === "completed") {
            completedCount++;
            completedTasksContainer.appendChild(createCompletedTaskCard(task));
          } else {
            remainingCount++;
            pendingTasks.push(task);
          }
        });
        document.getElementById(
          "completedTasksStats"
        ).textContent = `Completed: ${completedCount} | Remaining: ${remainingCount}`;
        const groupedTasks = {};
        pendingTasks.forEach((task) => {
          if (!groupedTasks[task.group]) groupedTasks[task.group] = [];
          groupedTasks[task.group].push(task);
        });
        groups.forEach((groupName) => {
          if (groupedTasks[groupName] && groupedTasks[groupName].length > 0) {
            const categorySection = document.createElement("div");
            categorySection.classList.add("category-section");
            categorySection.dataset.groupName = groupName;
            const categoryHeader = document.createElement("h3");
            categoryHeader.classList.add("category-header");
            categoryHeader.innerHTML = `${groupName} <button class="category-up-btn" onclick="moveCategoryUp(event)"><i class="ri-arrow-up-s-line"></i></button>`;
            categorySection.appendChild(categoryHeader);
            const taskCardCarousel = document.createElement("div");
            taskCardCarousel.classList.add("task-card-carousel");
            taskCardCarousel.id = `carousel-${groupName.replace(/\s+/g, "-")}`;
            categorySection.appendChild(taskCardCarousel);
            groupedTasks[groupName].sort((a, b) => a.order - b.order);
            groupedTasks[groupName].forEach((task) => {
              taskCardCarousel.appendChild(createTaskCard(task));
            });
            taskboardContainer.appendChild(categorySection);
            Sortable.create(taskCardCarousel, {
              group: "tasksGroup",
              handle: ".drag-handle",
              animation: 150,
              onEnd: (evt) => updateTaskOrder(evt),
            });
          }
        });
        if (
          taskboardContainer.children.length === 0 &&
          completedTasksContainer.children.length > 0
        ) {
          taskboardContainer.innerHTML =
            "<p>All tasks completed for this date!</p>";
        } else if (
          taskboardContainer.children.length === 0 &&
          completedTasksContainer.children.length === 0
        ) {
          taskboardContainer.innerHTML =
            "<p>No tasks for this date. Add one!</p>";
        }
      }
      function createTaskCard(task) {
        const taskCard = document.createElement("div");
        taskCard.classList.add("task-card");
        if (task.status === "ongoing") taskCard.classList.add("ongoing");
        if (task.status === "paused") taskCard.classList.add("paused");
        taskCard.dataset.taskId = task.id;
        let taskContentHTML = "";
        if (task.isTimed) {
          const remainingSeconds = task.duration - task.elapsedTime;
          let timerContent;
          if (remainingSeconds < 0) {
            timerContent = `+${formatTime(Math.abs(remainingSeconds))}`;
            taskCard.classList.add("overtime");
          } else {
            timerContent = formatTime(remainingSeconds);
          }
          taskContentHTML = `<div class="timer-display-container"><div class="timer-display" id="timer-${
            task.id
          }">${timerContent}</div><div class="task-actions">${getActionButtonsHTML(
            task
          )}</div></div><p class="task-duration">Target: ${formatTime(
            task.duration
          )}</p>`;
        } else {
          taskContentHTML = `<div class="timer-display-container"><div class="task-complete-checkbox" onclick="completeTodoTask('${task.id}', event)"></div></div>`;
        }
        taskCard.innerHTML = `<div class="drag-handle"><i class="ri-drag-move-2-fill"></i></div><button class="delete-task-btn" onclick="deleteTask('${task.id}')"><i class="ri-delete-bin-line"></i></button><h4 class="task-name">${task.name}</h4>${taskContentHTML}`;
        return taskCard;
      }
      function createCompletedTaskCard(task) {
        const completedTaskCard = document.createElement("div");
        completedTaskCard.classList.add("completed-task-card");
        let timeTakenHTML;
        if (task.isTimed) {
          timeTakenHTML = `<div class="time-taken">Time taken: ${formatTime(
            task.elapsedTime
          )} / Target: ${formatTime(task.duration)}</div>`;
        } else {
          timeTakenHTML = `<div class="time-taken no-time">To-Do Item</div>`;
        }
        completedTaskCard.innerHTML = `<button class="delete-completed-task-btn" onclick="deleteCompletedTask('${task.id}')"><i class="ri-delete-bin-line"></i></button><div class="task-name">${task.name}</div><div class="category-name">${task.group}</div>${timeTakenHTML}`;
        return completedTaskCard;
      }
      let activeTimers = {};
      function completeTodoTask(taskId, event) {
        event.stopPropagation();
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex !== -1) {
          tasks[taskIndex].status = "completed";
          saveTasks();
          displayTasksForDate(selectedDate);
        }
      }
      function updateTaskOrder(evt) {
        const toContainer = evt.to;
        const movedTask = tasks.find(
          (t) => t.id === parseInt(evt.item.dataset.taskId)
        );
        if (!movedTask) return;
        movedTask.group =
          toContainer.closest(".category-section").dataset.groupName;
        const reorderTasks = (container) => {
          const taskIds = Array.from(container.children).map((child) =>
            parseInt(child.dataset.taskId)
          );
          taskIds.forEach((id, index) => {
            const task = tasks.find((t) => t.id === id);
            if (task) {
              task.order = index;
            }
          });
        };
        reorderTasks(toContainer);
        if (evt.from !== toContainer) {
          reorderTasks(evt.from);
        }
        saveTasks();
      }
      document.addEventListener("DOMContentLoaded", () => {
        generateDateRow(currentDisplayDate);
        renderGroupDropdown();
        tasks.forEach((task) => {
          if (task.status === "ongoing" && task.isTimed) {
            startTask(task.id);
          }
        });
      });
      function getActionButtonsHTML(task) {
        switch (task.status) {
          case "pending":
            return `<button class="start-btn" onclick="startTask('${task.id}')"><i class="ri-play-fill"></i></button>`;
          case "ongoing":
            return `<button class="pause-btn" onclick="pauseTask('${task.id}')"><i class="ri-pause-fill"></i></button><button class="stop-btn" onclick="stopTask('${task.id}')"><i class="ri-stop-fill"></i></button>`;
          case "paused":
            return `<button class="resume-btn" onclick="startTask('${task.id}')"><i class="ri-play-fill"></i></button><button class="stop-btn" onclick="stopTask('${task.id}')"><i class="ri-stop-fill"></i></button>`;
          default:
            return "";
        }
      }
      function startTask(taskId) {
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex === -1 || tasks[taskIndex].status === "ongoing") return;
        if (activeTimers[taskId]) {
          clearInterval(activeTimers[taskId]);
        }
        tasks[taskIndex].status = "ongoing";
        tasks[taskIndex].startTime =
          Date.now() - tasks[taskIndex].elapsedTime * 1000;
        saveTasks();
        displayTasksForDate(selectedDate);
        activeTimers[taskId] = setInterval(() => {
          const currentTaskIndex = tasks.findIndex(
            (t) => t.id === parseInt(taskId)
          );
          if (
            currentTaskIndex === -1 ||
            tasks[currentTaskIndex].status !== "ongoing"
          ) {
            clearInterval(activeTimers[taskId]);
            delete activeTimers[taskId];
            return;
          }
          const task = tasks[currentTaskIndex];
          task.elapsedTime = Math.floor((Date.now() - task.startTime) / 1000);
          saveTasks();
          const timerDisplayElement = document.getElementById(
            `timer-${taskId}`
          );
          if (timerDisplayElement) {
            const remainingSeconds = task.duration - task.elapsedTime;
            const taskCard = timerDisplayElement.closest(".task-card");
            if (remainingSeconds < 0) {
              timerDisplayElement.textContent = `+${formatTime(
                Math.abs(remainingSeconds)
              )}`;
              if (taskCard) taskCard.classList.add("overtime");
            } else {
              timerDisplayElement.textContent = formatTime(remainingSeconds);
              if (taskCard) taskCard.classList.remove("overtime");
            }
          }
        }, 1000);
      }
      function pauseTask(taskId) {
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex === -1 || tasks[taskIndex].status !== "ongoing") return;
        tasks[taskIndex].status = "paused";
        clearInterval(activeTimers[taskId]);
        delete activeTimers[taskId];
        saveTasks();
        displayTasksForDate(selectedDate);
      }
      function stopTask(taskId) {
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex === -1) return;
        tasks[taskIndex].status = "completed";
        clearInterval(activeTimers[taskId]);
        delete activeTimers[taskId];
        saveTasks();
        displayTasksForDate(selectedDate);
      }
      function deleteTask(taskId) {
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex === -1) return;
        if (
          tasks[taskIndex].status === "ongoing" ||
          tasks[taskIndex].status === "paused"
        ) {
          clearInterval(activeTimers[taskId]);
          delete activeTimers[taskId];
        }
        tasks.splice(taskIndex, 1);
        saveTasks();
        displayTasksForDate(selectedDate);
      }
      function deleteCompletedTask(taskId) {
        tasks = tasks.filter((task) => task.id !== parseInt(taskId));
        saveTasks();
        displayTasksForDate(selectedDate);
      }
      function formatTime(totalSeconds) {
        const absSeconds = Math.abs(totalSeconds);
        const minutes = Math.floor(absSeconds / 60);
        const seconds = Math.floor(absSeconds % 60);
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(
          2,
          "0"
        )}`;
      }
      function moveCategoryUp(event) {
        const categorySection = event.target.closest(".category-section");
        if (!categorySection) return;
        const groupName = categorySection.dataset.groupName;
        const groupIndex = groups.indexOf(groupName);
        if (groupIndex > 0) {
          const prevGroupName = groups[groupIndex - 1];
          groups[groupIndex - 1] = groupName;
          groups[groupIndex] = prevGroupName;
          saveGroups();
          displayTasksForDate(selectedDate);
        }
      }
      function renderGroupDropdown() {
        const dropdownContent = document.getElementById("groupDropdownContent");
        dropdownContent.innerHTML = "";
        groups.forEach((groupName, index) => {
          const groupItem = document.createElement("div");
          groupItem.classList.add("group-item");
          groupItem.innerHTML = `<span onclick="selectGroup('${groupName}')">${groupName}</span><div class="group-actions"><i class="ri-pencil-line" onclick="editGroup('${groupName}', ${index}, event)"></i><i class="ri-delete-bin-line" onclick="deleteGroup('${groupName}', event)"></i></div>`;
          dropdownContent.appendChild(groupItem);
        });
        const addGroupSection = document.createElement("div");
        addGroupSection.classList.add("add-group-section");
        addGroupSection.innerHTML = `<input type="text" id="newGroupInput" placeholder="New Category Name"><button onclick="addGroup()">Add</button>`;
        dropdownContent.appendChild(addGroupSection);
        if (groupDropdownVisible) {
          dropdownContent.classList.add("show");
        } else {
          dropdownContent.classList.remove("show");
        }
      }
      function selectGroup(groupName) {
        document.getElementById("selectedGroupName").textContent = groupName;
        groupDropdownVisible = false;
        renderGroupDropdown();
      }
      function addGroup() {
        const newGroupName = document
          .getElementById("newGroupInput")
          .value.trim();
        if (newGroupName && !groups.includes(newGroupName)) {
          groups.push(newGroupName);
          saveGroups();
          renderGroupDropdown();
          document.getElementById("newGroupInput").value = "";
        }
      }
      function editGroup(oldGroupName, index, event) {
        event.stopPropagation();
        const groupItem = event.target.closest(".group-item");
        groupItem.innerHTML = "";
        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.value = oldGroupName;
        groupItem.appendChild(editInput);
        editInput.focus();
        const saveButton = document.createElement("i");
        saveButton.classList.add("ri-check-line");
        saveButton.style.marginLeft = "5px";
        saveButton.style.cursor = "pointer";
        groupItem.appendChild(saveButton);
        const cancelButton = document.createElement("i");
        cancelButton.classList.add("ri-close-line");
        cancelButton.style.marginLeft = "5px";
        cancelButton.style.cursor = "pointer";
        groupItem.appendChild(cancelButton);
        const saveEdit = function () {
          const newGroupName = editInput.value.trim();
          if (newGroupName && newGroupName !== oldGroupName) {
            tasks = tasks.map((task) => {
              if (task.group === oldGroupName) {
                task.group = newGroupName;
              }
              return task;
            });
            groups[index] = newGroupName;
            saveGroups();
            saveTasks();
            renderGroupDropdown();
            displayTasksForDate(selectedDate);
          } else {
            renderGroupDropdown();
          }
        };
        const cancelEdit = function () {
          renderGroupDropdown();
        };
        editInput.addEventListener("blur", saveEdit);
        saveButton.addEventListener("click", saveEdit);
        cancelButton.addEventListener("click", cancelEdit);
      }
      function deleteGroup(groupName, event) {
        event.stopPropagation();
        if (groupName === "General") {
          alert("Cannot delete the 'General' category.");
          return;
        }
        if (
          confirm(
            `Are you sure you want to delete the category "${groupName}"? Tasks in this category will be moved to 'General'.`
          )
        ) {
          tasks = tasks.map((task) => {
            if (task.group === groupName) {
              task.group = "General";
            }
            return task;
          });
          groups = groups.filter((group) => group !== groupName);
          saveGroups();
          saveTasks();
          renderGroupDropdown();
          displayTasksForDate(selectedDate);
          selectGroup("General");
        }
      }
    </script>
  </body>
</html>
