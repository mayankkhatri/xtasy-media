<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskboard App</title>
    <!-- Remix Icon CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      type="image/png"
      href="https://static.vecteezy.com/system/resources/previews/050/757/348/non_2x/clock-icon-transparent-background-free-png.png"
    />
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <!-- <link rel="stylesheet" href="styles.css"> -->
    <link rel="stylesheet" href="styles/taskboard.css" />
  </head>
  <body>
    <div class="container">
      <!-- Header Section -->
      <div class="header">
        <div class="logo">
          <img src="https://i.postimg.cc/k5F70t2x/Logo-2.png" alt="logo" />
        </div>
        <div class="app-buttons">
          <a href="timer.html" class="active">Taskboard</a>
          <a href="habits.html">Habits</a>
          <a href="body.html">Body</a>
        </div>
      </div>

      <!-- Date Row Section -->
      <div class="date-row" id="dateRow">
        <!-- Dates will be generated by JavaScript -->
      </div>

      <!-- Main Content Section -->
      <div class="main-content">
        <!-- Task Input Section -->
        <div class="task-input-section">
          <h2>Add Task</h2>
          <input type="text" id="taskNameInput" placeholder="Task Name" />

          <div class="group-name-dropdown">
            <div
              class="group-name-dropdown-btn"
              onclick="toggleGroupDropdown()"
            >
              <span id="selectedGroupName">Group Name</span>
              <i class="ri-arrow-down-s-line"></i>
            </div>
            <div class="group-name-dropdown-content" id="groupDropdownContent">
              <!-- Groups will be listed here -->
              <div class="add-group-section">
                <input
                  type="text"
                  id="newGroupInput"
                  placeholder="New Category Name"
                />
                <button onclick="addGroup()">Add</button>
              </div>
            </div>
          </div>

          <div class="time-options">
            <button data-minutes="5">5 Min</button>
            <button data-minutes="10">10 Min</button>
            <button data-minutes="15">15 Min</button>
            <button data-minutes="20">20 Min</button>
            <button data-minutes="25">25 Min</button>
            <button data-minutes="30">30 Min</button>
            <button data-minutes="45">45 Min</button>
          </div>
          <div class="custom-time-input">
            <input
              type="number"
              id="customMinutesInput"
              placeholder="Enter Minutes"
            />
            <span>Min</span>
          </div>

          <button class="add-task-btn" onclick="addTask()">Add Task</button>
        </div>

        <!-- Completed Tasks Section -->
        <div class="completed-tasks-section">
          <h2>Completed Tasks</h2>
          <div id="completedTasksContainer">
            <!-- Completed task cards will be added here -->
          </div>
          <div class="completed-tasks-stats" id="completedTasksStats">
            <!-- Stats will be shown here -->
          </div>
        </div>
      </div>

      <!-- Taskboard Section -->
      <div class="taskboard" id="taskboardContainer">
        <!-- Task categories and tasks will be generated here -->
      </div>
    </div>

    <script>
      // JavaScript for Taskboard App

      // --- Date Row Logic ---
      let selectedDate = null;

      function generateDateRow() {
        const dateRow = document.getElementById("dateRow");
        dateRow.innerHTML = "";

        const today = new Date();
        const currentDay = today.getDate();
        const daysInMonth = new Date(
          today.getFullYear(),
          today.getMonth() + 1,
          0
        ).getDate();
        const month = today.getMonth();
        const year = today.getFullYear();
        const monthNames = [
          "Jan",
          "Feb",
          "Mar",
          "Apr",
          "May",
          "Jun",
          "Jul",
          "Aug",
          "Sep",
          "Oct",
          "Nov",
          "Dec",
        ];
        const currentMonthName = monthNames[month];
        const todayDateStr = `${year}-${String(month + 1).padStart(
          2,
          "0"
        )}-${String(currentDay).padStart(2, "0")}`; // Get today's date in YYYY-MM-DD format

        const monthNameSpan = document.createElement("span");
        monthNameSpan.textContent = currentMonthName + " ";
        dateRow.appendChild(monthNameSpan);

        for (let i = 1; i <= daysInMonth; i++) {
          const dateElement = document.createElement("div");
          dateElement.classList.add("date-number");
          dateElement.textContent = i;
          const dateStr = `${year}-${String(month + 1).padStart(
            2,
            "0"
          )}-${String(i).padStart(2, "0")}`;
          dateElement.dataset.date = dateStr;

          if (i === currentDay) {
            dateElement.classList.add("today");
          }

          dateElement.addEventListener("click", () => {
            document
              .querySelectorAll(".date-number.selected")
              .forEach((el) => el.classList.remove("selected"));
            dateElement.classList.add("selected");
            selectedDate = dateStr;
            displayTasksForDate(selectedDate);
          });

          if (i === currentDay) {
            selectedDate = todayDateStr; // Initialize selectedDate to today's date string
            dateElement.classList.add("selected"); // Select today's date visually
          }

          dateRow.appendChild(dateElement);
        }
        // Call displayTasksForDate with the initial selectedDate AFTER the loop and date elements are created.
        displayTasksForDate(selectedDate);
      }

      // --- Task Input Section Logic ---
      const timeOptionButtons = document.querySelectorAll(
        ".time-options button"
      );
      let selectedMinutes = 0;

      timeOptionButtons.forEach((button) => {
        button.addEventListener("click", function () {
          timeOptionButtons.forEach((btn) => btn.classList.remove("selected"));
          this.classList.add("selected");
          selectedMinutes = parseInt(this.dataset.minutes);
          document.getElementById("customMinutesInput").value = "";
        });
      });

      document
        .getElementById("customMinutesInput")
        .addEventListener("input", function () {
          timeOptionButtons.forEach((btn) => btn.classList.remove("selected"));
          selectedMinutes = parseInt(this.value) || 0;
        });

      // --- Local Storage Management ---
      const TASKS_STORAGE_KEY = "taskboard_tasks";
      const GROUPS_STORAGE_KEY = "taskboard_groups";
      let tasks = loadTasks() || [];
      let groups = loadGroups() || ["General"];

      function saveTasks() {
        console.log("Saving tasks to local storage:", tasks);
        localStorage.setItem(TASKS_STORAGE_KEY, JSON.stringify(tasks));
      }

      function loadTasks() {
        const tasksData = localStorage.getItem(TASKS_STORAGE_KEY);
        const loadedTasks = tasksData ? JSON.parse(tasksData) : null;
        console.log("Loaded tasks from local storage:", loadedTasks);
        return loadedTasks;
      }
      function saveGroups() {
        localStorage.setItem(GROUPS_STORAGE_KEY, JSON.stringify(groups));
      }

      function loadGroups() {
        const groupsData = localStorage.getItem(GROUPS_STORAGE_KEY);
        return groupsData ? JSON.parse(groupsData) : null;
      }

      // --- Group Dropdown Management ---
      let groupDropdownVisible = false;

      function toggleGroupDropdown() {
        groupDropdownVisible = !groupDropdownVisible;
        renderGroupDropdown();
      }

      function renderGroupDropdown() {
        const dropdownContent = document.getElementById("groupDropdownContent");
        const selectedGroupNameSpan =
          document.getElementById("selectedGroupName");
        dropdownContent.innerHTML = "";

        groups.forEach((groupName, index) => {
          const groupItem = document.createElement("div");
          groupItem.classList.add("group-item");
          groupItem.innerHTML = `
                    <span onclick="selectGroup('${groupName}')">${groupName}</span>
                    <div class="group-actions">
                        <i class="ri-pencil-line" onclick="editGroup('${groupName}', ${index}, event)"></i>
                        <i class="ri-delete-bin-line" onclick="deleteGroup('${groupName}', event)"></i>
                    </div>
                `;
          dropdownContent.appendChild(groupItem);
        });

        const addGroupSection = document.createElement("div");
        addGroupSection.classList.add("add-group-section");
        addGroupSection.innerHTML = `
                <input type="text" id="newGroupInput" placeholder="New Category Name">
                <button onclick="addGroup()">Add</button>
            `;
        dropdownContent.appendChild(addGroupSection);

        if (groupDropdownVisible) {
          dropdownContent.classList.add("show");
        } else {
          dropdownContent.classList.remove("show");
        }
      }

      function selectGroup(groupName) {
        document.getElementById("selectedGroupName").textContent = groupName;
        groupDropdownVisible = false;
        renderGroupDropdown();
      }

      function addGroup() {
        const newGroupName = document
          .getElementById("newGroupInput")
          .value.trim();
        if (newGroupName && !groups.includes(newGroupName)) {
          groups.push(newGroupName);
          saveGroups();
          renderGroupDropdown();
          document.getElementById("newGroupInput").value = "";
        }
      }

      function editGroup(oldGroupName, index, event) {
        event.stopPropagation();

        const groupItem = event.target.closest(".group-item");
        groupItem.innerHTML = "";

        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.value = oldGroupName;
        groupItem.appendChild(editInput);
        editInput.focus();

        const saveButton = document.createElement("i");
        saveButton.classList.add("ri-check-line");
        saveButton.style.marginLeft = "5px";
        saveButton.style.cursor = "pointer";
        groupItem.appendChild(saveButton);

        const cancelButton = document.createElement("i");
        cancelButton.classList.add("ri-close-line");
        cancelButton.style.marginLeft = "5px";
        cancelButton.style.cursor = "pointer";
        groupItem.appendChild(cancelButton);

        const saveEdit = function () {
          const newGroupName = editInput.value.trim();
          if (newGroupName && newGroupName !== oldGroupName) {
            tasks = tasks.map((task) => {
              if (task.group === oldGroupName) {
                task.group = newGroupName;
              }
              return task;
            });

            groups[index] = newGroupName;
            saveGroups();
            saveTasks();
            renderGroupDropdown();
            displayTasksForDate(selectedDate);
          } else {
            renderGroupDropdown();
          }
        };

        const cancelEdit = function () {
          renderGroupDropdown();
        };

        editInput.addEventListener("blur", saveEdit);
        saveButton.addEventListener("click", saveEdit);
        cancelButton.addEventListener("click", cancelEdit);
      }

      function deleteGroup(groupName, event) {
        event.stopPropagation();
        if (groupName === "General") {
          alert("Cannot delete the 'General' category.");
          return;
        }

        if (
          confirm(
            `Are you sure you want to delete the category "${groupName}"? Tasks in this category will be moved to 'General'.`
          )
        ) {
          tasks = tasks.map((task) => {
            if (task.group === groupName) {
              task.group = "General";
            }
            return task;
          });
          groups = groups.filter((group) => group !== groupName);
          saveGroups();
          saveTasks();
          renderGroupDropdown();
          displayTasksForDate(selectedDate);
          selectGroup("General");
        }
      }

      // --- Task Adding and Display ---
      function addTask() {
        const taskName = document.getElementById("taskNameInput").value.trim();
        const groupName =
          document.getElementById("selectedGroupName").textContent;
        const durationMinutes = selectedMinutes;

        if (!taskName) {
          alert("Task name cannot be empty.");
          return;
        }
        if (durationMinutes <= 0) {
          alert("Please select or enter a valid duration.");
          return;
        }
        if (!selectedDate) {
          alert("Please select a date first.");
          return;
        }

        const newTask = {
          id: Date.now(),
          name: taskName,
          group: groupName,
          duration: durationMinutes * 60,
          status: "pending",
          startTime: null,
          elapsedTime: 0,
          taskDate: selectedDate,
        };

        tasks.push(newTask);

        console.log("addTask - tasks before save:", tasks);
        saveTasks();
        displayTasksForDate(selectedDate);
        document.getElementById("taskNameInput").value = "";
        timeOptionButtons.forEach((btn) => btn.classList.remove("selected"));
        document.getElementById("customMinutesInput").value = "";
        selectedMinutes = 0;
      }

      function displayTasksForDate(date) {
        console.log("displayTasksForDate CALLED for date:", date);
        const taskboardContainer =
          document.getElementById("taskboardContainer");
        taskboardContainer.innerHTML = "";
        const completedTasksContainer = document.getElementById(
          "completedTasksContainer"
        );
        completedTasksContainer.innerHTML = "";

        const tasksForDate = tasks.filter((task) => task.taskDate === date);
        console.log("Tasks for date", date, ":", tasksForDate);

        let completedCount = 0;
        let remainingCount = 0;
        tasksForDate.forEach((task) => {
          if (task.status === "completed") {
            completedCount++;
            completedTasksContainer.appendChild(createCompletedTaskCard(task));
          } else {
            remainingCount++;
          }
        });
        // Update completed tasks stats
        const statsElement = document.getElementById("completedTasksStats");
        statsElement.textContent = `Completed : ${completedCount} | Remaining : ${remainingCount}`;

        if (tasksForDate.length === 0) {
          taskboardContainer.innerHTML = "<p>No tasks for this date.</p>";
        }

        const groupedTasks = {};
        tasksForDate.forEach((task) => {
          if (!groupedTasks[task.group]) {
            groupedTasks[task.group] = [];
          }
          groupedTasks[task.group].push(task);
        });

        console.log("Grouped tasks:", groupedTasks);

        for (const groupName in groupedTasks) {
          const categorySection = document.createElement("div");
          categorySection.classList.add("category-section");

          const categoryHeader = document.createElement("h3");
          categoryHeader.classList.add("category-header");
          categoryHeader.innerHTML = `${groupName} <button class="category-up-btn" onclick="moveCategoryUp(event)"><i class="ri-arrow-up-s-line"></i></button>`; // ADDED UP BUTTON
          categorySection.appendChild(categoryHeader);

          const taskCardCarousel = document.createElement("div");
          taskCardCarousel.classList.add("task-card-carousel");
          taskCardCarousel.id = `taskCarousel-${groupName
            .replace(/\s+/g, "-")
            .toLowerCase()}`; // ADDED ID FOR SORTABLE
          categorySection.appendChild(taskCardCarousel);

          // Initialize SortableJS for each carousel
          Sortable.create(taskCardCarousel, {
            group: "tasksGroup",
            handle: ".drag-handle", // Use drag handle for dragging
            onEnd: function (evt) {
              updateTaskCategoryAndOrder(evt, date);
            },
            animation: 150,
            fallbackOnBody: true,
            swapThreshold: 0.65,
          });

          let hasTasksInCategory = false;
          groupedTasks[groupName].forEach((task) => {
            if (task.status !== "completed") {
              taskCardCarousel.appendChild(createTaskCard(task));
              hasTasksInCategory = true;
            }
          });

          if (hasTasksInCategory) {
            taskboardContainer.appendChild(categorySection);
          }
        }
        if (
          tasksForDate.filter((task) => task.status !== "completed").length ===
            0 &&
          completedTasksContainer.children.length === 0
        ) {
          taskboardContainer.innerHTML = "<p>No tasks for this date.</p>";
        } else if (
          tasksForDate.filter((task) => task.status !== "completed").length ===
            0 &&
          completedTasksContainer.children.length > 0
        ) {
          taskboardContainer.innerHTML =
            "<p>No pending tasks for this date.</p>";
        }
      }

      function createTaskCard(task) {
        const taskCard = document.createElement("div");
        taskCard.classList.add("task-card");
        if (task.status === "ongoing") taskCard.classList.add("ongoing");
        if (task.status === "paused") taskCard.classList.add("paused");
        taskCard.dataset.taskId = task.id;
        taskCard.dataset.taskGroup = task.group; // ADDED: store group on card for drag/drop

        taskCard.innerHTML = `
                <div class="drag-handle"><i class="ri-drag-move-2-fill"></i></div>  <!-- Drag handle -->
                <button class="delete-task-btn" onclick="deleteTask('${
                  task.id
                }')"><i class="ri-delete-bin-line"></i></button>
                <h4 class="task-name">${task.name}</h4>
                <div class="timer-display-container">
                    <div class="timer-display" id="timer-${task.id}">
                        ${formatTime(task.duration - task.elapsedTime)}
                    </div>
                    <div class="task-actions">
                        ${getActionButtonsHTML(task)}
                    </div>
                </div>
                <p class="task-duration">Target: ${formatTime(
                  task.duration
                )}</p>
            `;
        return taskCard;
      }

      function createCompletedTaskCard(task) {
        const completedTaskCard = document.createElement("div");
        completedTaskCard.classList.add("completed-task-card");
        completedTaskCard.innerHTML = `
                <button class="delete-completed-task-btn" onclick="deleteCompletedTask('${
                  task.id
                }')"><i class="ri-delete-bin-line"></i></button>
                <div class="task-name">${task.name}</div>
                <div class="category-name">${task.group}</div>
                <div class="time-taken">Time taken: ${formatTime(
                  task.elapsedTime
                )} / Target: ${formatTime(task.duration)}</div>
            `;
        return completedTaskCard;
      }

      function getActionButtonsHTML(task) {
        switch (task.status) {
          case "pending":
            return `<button class="start-btn" onclick="startTask('${task.id}')"><i class="ri-play-fill"></i></button>`;
          case "ongoing":
            return `<button class="pause-btn" onclick="pauseTask('${task.id}')"><i class="ri-pause-fill"></i></button>
                            <button class="stop-btn" onclick="stopTask('${task.id}')"><i class="ri-stop-fill"></i></button>`;
          case "paused":
            return `<button class="resume-btn" onclick="startTask('${task.id}')"><i class="ri-play-fill"></i></button>
                            <button class="stop-btn" onclick="stopTask('${task.id}')"><i class="ri-stop-fill"></i></button>`;
          default:
            return "";
        }
      }

      // --- Task Actions (Start, Pause, Resume, Stop, Delete) ---
      let activeTimers = {};

      function startTask(taskId) {
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex === -1 || tasks[taskIndex].status === "ongoing") return;

        tasks[taskIndex].status = "ongoing";
        tasks[taskIndex].startTime =
          Date.now() - tasks[taskIndex].elapsedTime * 1000;

        console.log("startTask - tasks before save:", tasks);
        saveTasks();
        displayTasksForDate(selectedDate);

        const timerDisplayElement = document.getElementById(`timer-${taskId}`);

        activeTimers[taskId] = setInterval(() => {
          if (tasks[taskIndex].status !== "ongoing") {
            clearInterval(activeTimers[taskId]);
            delete activeTimers[taskId];
            return;
          }

          const elapsedTimeMs = Date.now() - tasks[taskIndex].startTime;
          tasks[taskIndex].elapsedTime = Math.floor(elapsedTimeMs / 1000);
          timerDisplayElement.textContent = formatTime(
            tasks[taskIndex].duration - tasks[taskIndex].elapsedTime
          );
          saveTasks();

          if (tasks[taskIndex].elapsedTime >= tasks[taskIndex].duration) {
            clearInterval(activeTimers[taskId]);
            delete activeTimers[taskId];
            stopTask(taskId);
          }
        }, 1000);
      }

      function pauseTask(taskId) {
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex === -1 || tasks[taskIndex].status !== "ongoing") return;

        tasks[taskIndex].status = "paused";
        clearInterval(activeTimers[taskId]);
        delete activeTimers[taskId];

        console.log("pauseTask - tasks before save:", tasks);
        saveTasks();
        displayTasksForDate(selectedDate);
      }

      function stopTask(taskId) {
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex === -1) return;

        tasks[taskIndex].status = "completed";
        clearInterval(activeTimers[taskId]);
        delete activeTimers[taskId];

        console.log("stopTask - tasks before save:", tasks);
        saveTasks();
        displayTasksForDate(selectedDate);
      }

      function deleteTask(taskId) {
        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );
        if (taskIndex === -1) return;

        if (
          tasks[taskIndex].status === "ongoing" ||
          tasks[taskIndex].status === "paused"
        ) {
          clearInterval(activeTimers[taskId]);
          delete activeTimers[taskId];
        }

        tasks.splice(taskIndex, 1);

        console.log("deleteTask - tasks before save:", tasks);
        saveTasks();
        displayTasksForDate(selectedDate);
      }

      function deleteCompletedTask(taskId) {
        tasks = tasks.filter((task) => task.id !== parseInt(taskId)); // Remove completed task from tasks array
        saveTasks();
        displayTasksForDate(selectedDate); // Re-render tasks to update completed list and stats
      }

      // --- Utility Function to Format Time ---
      function formatTime(totalSeconds) {
        const minutes = Math.floor(Math.max(0, totalSeconds) / 60);
        const seconds = Math.floor(Math.max(0, totalSeconds) % 60);
        return `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(
          2,
          "0"
        )}`;
      }
      // --- Drag & Drop and Category Move Functions ---
      function updateTaskCategoryAndOrder(evt, taskDate) {
        const taskId = evt.item.dataset.taskId;
        const oldGroup = evt.item.dataset.taskGroup; // Get the original group before dragging
        let newGroup = evt.item.parentNode.id
          .replace("taskCarousel-", "")
          .replace(/-/g, " "); // Extract group from carousel ID

        // Create a mapping of original group names
        const groupNameMap = tasks.reduce((map, task) => {
          map[task.group.toLowerCase()] = task.group;
          return map;
        }, {});

        // Preserve correct case of group name
        if (groupNameMap[newGroup.toLowerCase()]) {
          newGroup = groupNameMap[newGroup.toLowerCase()];
        }

        const taskIndex = tasks.findIndex(
          (task) => task.id === parseInt(taskId)
        );

        if (taskIndex !== -1) {
          const task = tasks[taskIndex];
          const newCarousel = evt.item.parentNode;
          const newTaskOrderIds = Array.from(newCarousel.children).map((item) =>
            parseInt(item.dataset.taskId)
          );

          // Update task category only if it changed
          if (oldGroup !== newGroup) {
            task.group = newGroup;
          }

          // Reorder tasks within the category (both intra and inter category move)
          const categoryTasks = tasks.filter(
            (t) => t.group === newGroup && t.taskDate === taskDate
          );
          const orderedTasks = [];
          newTaskOrderIds.forEach((id) => {
            const foundTask = categoryTasks.find((t) => t.id === id);
            if (foundTask) {
              orderedTasks.push(foundTask);
            }
          });

          // Get tasks NOT in the current category for this date
          const otherTasks = tasks.filter(
            (t) =>
              !(t.group === newGroup && t.taskDate === taskDate) ||
              t.status === "completed"
          );

          // Combine ordered tasks with other tasks to update the main tasks list.
          tasks = [...otherTasks, ...orderedTasks];

          saveTasks();
          displayTasksForDate(taskDate); // Re-render task board to reflect changes
        }
      }

      function moveCategoryUp(event) {
        console.log("moveCategoryUp function called!"); // Debugging log
        const categoryHeader =
          event.target.closest(".category-header").parentElement; // Find category section
        const taskboardContainer =
          document.getElementById("taskboardContainer");
        const prevCategory = categoryHeader.previousElementSibling; // Get previous category

        if (prevCategory) {
          taskboardContainer.insertBefore(categoryHeader, prevCategory); // Move category up
        } else {
          console.log("No previous category to move above."); // Debugging log when no prev category
        }
      }

      // --- Initialization ---
      document.addEventListener("DOMContentLoaded", () => {
        generateDateRow();
        renderGroupDropdown();
        // displayTasksForDate(selectedDate); <- displayTasksForDate is now called inside generateDateRow at the end, after setting selectedDate.
      });
    </script>
  </body>
</html>
